services:
  db:
    image: postgres:16
    container_name: chat-db
    restart: always
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
  # HOST(wejscie od strony mojego komputera) / KONTENER(Postgres na tym porcie słucha), 
    
  auth-service:
    build: ./services/auth-service
    ports:
      - "8080:8080"
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ASIARNR4RPKIAT4BX7AR
      AWS_SECRET_ACCESS_KEY: Btjpc1hQWb1kWtlisqD1CTpS2a+zhHNqJEFzVh8h
      AWS_SESSION_TOKEN: 
    depends_on:
      - db

  chat-service:
    build: ./services/chat-service
    ports:
      - "8081:8081"
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY: test
      AWS_SECRET_KEY: test
      AWS_SNS_ENDPOINT: http://localstack:4566
      AWS_SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:chatapp-notifications
    depends_on:
      - db

  file-service:
    build: ./services/file-service
    ports:
      - "8082:8082"
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY: ASIARNR4RPKIAT4BX7AR
      AWS_SECRET_KEY: Btjpc1hQWb1kWtlisqD1CTpS2a+zhHNqJEFzVh8h
      AWS_SESSION_TOKEN: 
      AWS_SNS_ENDPOINT: http://localstack:4566
      AWS_SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:chatapp-notifications
      AWS_S3_ENDPOINT: http://localstack:4566
      AWS_DYNAMODB_ENDPOINT: http://localstack:4566
      FILE_BUCKET_NAME: chatapp-file-bucket
      FILE_TABLE_NAME: chatapp-file-metadata
    depends_on:
      - localstack

  notification-db:
    image: postgres:16
    container_name: notification-db
    restart: always
    environment:
      POSTGRES_DB: notificationdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"

  notification-service:
    build: ./services/notification-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notificationdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      AWS_REGION: us-east-1
      AWS_SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:chatapp-notifications
      CHAT_SERVICE_BASE_URL: http://chat-service:8081
    depends_on:
      - notification-db

  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb,sns
      - LOCALSTACK_AUTH_TOKEN=ls-tAqO7488-lIMO-cOXO-yuXo-YiPaXoYedd93
      - EXTRA_CORS_ALLOWED_ORIGINS=*
      - EXTRA_CORS_ALLOWED_HEADERS=*
      - ALLOW_CORS_RESOURCES=1
    volumes:
      - "./localstack-data:/var/lib/localstack"
      - "./init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - auth-service
      - chat-service
      - file-service
      - notification-service